name: Update tier list and prices

on:
  schedule:
    - cron: "17 9 * * *"  # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Each download is independent: if one fails, the other still runs and its
      # results are still committed. The job is marked failed at the end so it's noticed.
      - name: Download tier list
        id: sheet
        continue-on-error: true
        run: python scripts/update_sheet.py
      - name: Download store prices
        id: prices
        continue-on-error: true
        run: python scripts/update_prices.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update tier list and prices"
          git push
      - name: Report failed downloads
        if: steps.sheet.outcome == 'failure' || steps.prices.outcome == 'failure'
        run: |
          echo "Tier list download: ${{ steps.sheet.outcome }}"
          echo "Price download: ${{ steps.prices.outcome }}"
          echo "See the step logs above for the cause."
          exit 1
